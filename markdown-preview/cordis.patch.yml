# The bundle layer for this plugin. A profile that lists the package as a
# bundle (`dsh plugin --profile web add /path/to/dsh-plugins/markdown-preview`)
# inserts this row at boot. The row names the package rather than a path,
# because a bundle layer resolves every row name against the bundle's own
# directory.
- insert:
    - id: markdown-preview
      name: dsh-markdown-preview
